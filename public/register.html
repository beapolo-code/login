<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f2eeff" />
  <title>Crear cuenta</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth">
  <main class="auth-card">
    <div class="brand" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="4" y="10" width="16" height="11" rx="3.2" stroke="currentColor" stroke-width="2" />
        <path d="M8 10V7.2a4 4 0 0 1 8 0V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <path d="M12 14.2v2.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </div>

    <h1>Crear cuenta</h1>
    <p class="subtitle">Empieza en segundos</p>

    <form id="register-form" class="form" novalidate>
      <div class="field">
        <label for="fullName">Nombre completo</label>
        <div class="input-wrap">
          <input
            id="fullName"
            name="fullName"
            type="text"
            autocomplete="name"
            placeholder="Ej: María Fernanda Pérez"
            maxlength="80"
            required
          />
        </div>
      </div>

      <div class="field">
        <label for="cedula">Número de cédula</label>
        <div class="input-wrap">
          <input
            id="cedula"
            name="cedula"
            type="text"
            inputmode="numeric"
            autocomplete="username"
            placeholder="Ej: 1712345675"
            maxlength="10"
            aria-describedby="cedula-hint"
            required
          />
        </div>
        <p class="hint" id="cedula-hint">10 dígitos, sin guiones ni espacios.</p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="tucorreo@ejemplo.com"
            maxlength="254"
            required
          />
        </div>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-wrap has-toggle">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="Mínimo 8 caracteres"
            maxlength="72"
            required
          />
          <button
            type="button"
            class="toggle-password"
            id="toggle-password"
            aria-label="Mostrar contraseña"
            aria-pressed="false"
          >
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m3 3 18 18" />
              <path d="M10.6 6.1A10.4 10.4 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.2 3.8" />
              <path d="M6.4 6.9C3.9 8.7 2.5 12 2.5 12S6 18 12 18c1.6 0 3-.4 4.2-1" />
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
            </svg>
          </button>
        </div>
      </div>

      <div class="alert" id="message" role="alert" aria-live="polite" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7.5v5.5" />
          <path d="M12 16.5h.01" />
        </svg>
        <span id="message-text"></span>
      </div>

      <button class="btn-primary" id="submit" type="submit">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label">Registrarme</span>
      </button>
    </form>

    <p class="alt">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
  </main>

  <script src="/js/auth.js" defer></script>
</body>
</html>
