<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f2eeff" />
  <title>Mi cuenta</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="app">
  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="4" y="10" width="16" height="11" rx="3.2" stroke="currentColor" stroke-width="2" />
          <path d="M8 10V7.2a4 4 0 0 1 8 0V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path d="M12 14.2v2.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
      <span>Mi cuenta</span>
    </div>

    <button class="btn-ghost" id="logout" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
        <path d="m10 17 5-5-5-5" />
        <path d="M15 12H3" />
      </svg>
      Cerrar sesión
    </button>
  </header>

  <main class="app-main">
    <section class="panel">
      <div class="panel-head">
        <div class="avatar" id="avatar" aria-hidden="true">--</div>
        <div>
          <h1 id="greeting">Hola</h1>
          <p class="subtitle">Esta es la información de tu cuenta.</p>
        </div>
        <span class="status-pill">Sesión activa</span>
      </div>

      <dl class="profile">
        <div class="profile-item">
          <dt>Nombre completo</dt>
          <dd id="p-name">...</dd>
        </div>
        <div class="profile-item">
          <dt>Cédula</dt>
          <dd id="p-cedula">...</dd>
        </div>
        <div class="profile-item">
          <dt>Email</dt>
          <dd id="p-email">...</dd>
        </div>
        <div class="profile-item">
          <dt>Miembro desde</dt>
          <dd id="p-created">...</dd>
        </div>
      </dl>

      <div class="alert" id="message" role="alert" aria-live="polite" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7.5v5.5" />
          <path d="M12 16.5h.01" />
        </svg>
        <span id="message-text"></span>
      </div>
    </section>
  </main>

  <script src="/js/auth.js" defer></script>
</body>
</html>
